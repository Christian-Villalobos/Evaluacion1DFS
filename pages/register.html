<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - PoE Currency</title>
  <link rel="stylesheet" href="../styles/bulma.css">
  <link rel="stylesheet" href="../styles/estilos.css">
</head>
<body>
  <header class="section has-background-dark">
    <div class="has-text-centered">
      <a href="../index.html">
        <figure class="image is-128x128 is-inline-block">
          <img src="../images/Path-of-Exile-Logo.webp" alt="Path of Exile Logo">
        </figure>
      </a>
      <h1 class="title has-text-warning">CREAR CUENTA</h1>
    </div>
  </header>

  <main class="container mt-5">
    <div class="columns is-centered">
      <div class="column is-half">
        <form id="formRegistro" class="box" novalidate>
          <!-- CAMBIO: se agrega el input del nombre de usuario. -->
          <!-- Función: este campo se valida en JS y se guarda junto al usuario. -->
          <div class="field">
            <label class="label" for="username">Nombre de Usuario</label>
            <div class="control">
              <input
                id="username"
                class="input"
                type="text"
                placeholder="Ej: Exile123"
                required
              >
            </div>
            <p class="help is-danger is-hidden" id="err-username">
              El usuario debe tener entre 4 y 15 caracteres alfanuméricos.
            </p>
          </div>

          <!-- CAMBIO: se agrega el input del correo electrónico. -->
          <!-- Función: será usado para verificar si existe el usuario en localStorage. -->
          <div class="field">
            <label class="label" for="email">Correo Electrónico</label>
            <div class="control">
              <input
                id="email"
                class="input"
                type="email"
                placeholder="correo@ejemplo.com"
                required
              >
            </div>
            <p class="help is-danger is-hidden" id="err-email">
              Ingresa un correo válido.
            </p>
          </div>

          <!-- CAMBIO: se agrega la contraseña. -->
          <!-- Función: será almacenada junto al usuario para simular login. -->
          <div class="field">
            <label class="label" for="password">Contraseña</label>
            <div class="control">
              <input
                id="password"
                class="input"
                type="password"
                placeholder="Mínimo 6 caracteres y 1 número"
                required
              >
            </div>
            <p class="help is-danger is-hidden" id="err-password">
              La contraseña debe tener al menos 6 caracteres y 1 número.
            </p>
          </div>

          <div class="field is-grouped is-grouped-centered mt-4">
            <div class="control">
              <button type="submit" class="button is-primary">Registrarse</button>
            </div>
            <div class="control">
              <a href="login.html" class="button is-light">Ya tengo cuenta</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="../scripts/scripts.js"></script>
</body>
</html>
