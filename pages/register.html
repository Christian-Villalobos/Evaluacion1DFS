<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - PoE Currency</title>
    <link rel="stylesheet" href="../styles/bulma.css">
    <link rel="stylesheet" href="../styles/estilos.css">
</head>
<body>
    <header class="section has-background-dark">
        <div class="has-text-centered">
            <a href="../index.html">
                <figure class="image is-128x128 is-inline-block">
                    <img src="../images/Path-of-Exile-Logo.webp" alt="Path of Exile Logo">
                </figure>
            </a>
            <h1 class="title has-text-warning">CREAR CUENTA</h1>
        </div>
    </header>
    <main class="container mt-5">
        <div class="columns is-centered">
            <div class="column is-half">
                <form id="formRegistro" class="box" novalidate>
                    <!-- Nombre de Usuario -->
                    <div class="field">
                        <label class="label" for="username">Nombre de Usuario</label>
                        <div class="control">
                            <input class="input" type="text" id="username" autocomplete="username" placeholder="Ej: ExilePlayer99">
                        </div>
                        <p class="help is-danger is-hidden" id="err-username">El usuario debe tener entre 4 y 15 caracteres alfanuméricos.</p>
                    </div>
                    <!-- Email -->
                    <div class="field">
                        <label class="label" for="email">Correo Electrónico</label>
                        <div class="control">
                            <input class="input" type="email" id="email" autocomplete="email" placeholder="usuario@correo.cl">
                        </div>
                        <p class="help is-danger is-hidden" id="err-email">Ingrese un formato de correo válido (ej: nombre@dominio.com).</p>
                    </div>
                    <!-- Password -->
                    <div class="field">
                        <label class="label" for="password">Contraseña</label>
                        <div class="control">
                            <input class="input" type="password" id="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
                        </div>
                        <p class="help is-danger is-hidden" id="err-password">La contraseña debe tener al menos 6 caracteres y al menos 1 número.</p>
                    </div>
                    <div class="field is-grouped is-grouped-centered mt-4">
                        <div class="control">
                            <button type="submit" class="button is-primary">Registrarse</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script src="../scripts/scripts.js"></script>
</body>
</html>
