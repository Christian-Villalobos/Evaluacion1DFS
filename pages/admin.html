<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - PoE Currency</title>
    <link rel="stylesheet" href="../styles/bulma.css">
    <link rel="stylesheet" href="../styles/estilos.css">
</head>
<body>
    <header class="section has-background-dark">
        <div class="container">
            <div class="columns is-vcentered">
                <div class="column">
                    <h1 class="title has-text-danger">PANEL DE ADMINISTRACIÓN</h1>
                </div>
                <div class="column has-text-right">
                    <button id="logout-admin" class="button is-light">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container mt-5" id="admin-content">
        <div class="box">
            <h2 class="title is-4">Bienvenido, Administrador</h2>
            <p>Desde aquí podrás gestionar los productos de la tienda y ver usuarios registrados más adelante.</p>
            <div class="buttons mt-4">
                <a href="tienda.html" class="button is-primary">Ver Tienda</a>
            </div>
        </div>
    </main>

    <script src="../scripts/scripts.js"></script>
</body>
</html>
