<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>PATH OF EXILE CURRENCY BUY AND SELLING</title>
  <link rel="stylesheet" href="styles/bulma.css">
  <link rel="stylesheet" href="styles/estilos.css">
</head>

<body>
  
  <header class="section">

    <h1 class="title has-text-primary has-text-centered">
      PATH OF EXILE CURRENCY
    </h1>
    <h2 class="subtitle has-text-centered">
      BUY AND SELLING
    </h2>
    <div class="has-text-centered">
      <figure class="image is-128x128 is-inline-block">
        <img src="/images/avceb1aju.webp" alt="Path of Exile Logo">
      </figure>
    </div>

  </header>

  <main class="container">
    <div class="columns is-centered">
      <div class="column is-one-third has-text-centered">
        <figure class="image is-128x128 is-inline-block">
          <img src="/images/Divine Orb.webp" alt="Divine Orb">
        </figure>

        <div class="field is-grouped is-grouped-centered">
          <div class="button-group is-centered mt-3">
            <button class="button is-success is-rounded">
              Buy
            </button>
            <button class="button is-danger is-rounded">
              Sell
            </button>
          </div>
        </div>

      </div>
      <div class="column is-one-third has-text-centered">
        <figure class="image is-128x128 is-inline-block">
          <img src="/images/Mirror.webp" alt="Mirror Orb">
        </figure>

        <div class="field is-grouped is-grouped-centered">
          <div class="button-group is-centered mt-3">
            <button class="button is-success is-rounded">
              Buy
            </button>
            <button class="button is-danger is-rounded">
              Sell
            </button>

          </div>
        </div>

      </div>
      <div class="column is-one-third has-text-centered">
        <figure class="image is-128x128 is-inline-block">
          <img src="/images/chaos.webp" alt="Chaos Orb">
        </figure>

        <div class="field is-grouped is-grouped-centered">
          <div class="button-group is-centered mt-3">
            <button class="button is-success is-rounded">
              Buy
            </button>
            <button class="button is-danger is-rounded">
              Sell
            </button>

          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>

  </footer>

  <script src="script.js"></script>
</body>
